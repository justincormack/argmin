[package]
name = "s3-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Server (for local TestServer)
server = { path = "../server" }
auth = { path = "../auth" }
ec = { path = "../ec" }
storage = { path = "../storage" }

# AWS SDK (independent S3 client for validation)
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"

# Async runtime (required by AWS SDK)
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Test infrastructure
tempfile = "3"

# POST Object tests (raw HTTP, SigV4 signing)
ureq = "3"
base64 = "0.22"
serde_json = "1"
ring = "0.17"
