[package]
name = "s3-tests"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["ring"]
ring = [
    "auth/ring",
    "checksum/ring",
    "s3-types/ring",
    "server-core/ring",
    "server_http/ring",
    "storage/ring",
]
openssl = [
    "auth/openssl",
    "checksum/openssl",
    "s3-types/openssl",
    "server-core/openssl",
    "server_http/openssl",
    "storage/openssl",
]
deep-tracing = [
    "auth/deep-tracing",
    "ec/deep-tracing",
    "observability/deep-tracing",
    "server-core/deep-tracing",
    "server_http/deep-tracing",
    "storage/deep-tracing",
]
uat-pg-topology = ["storage/test-hooks"]

[[bin]]
name = "uat_pg_backfill_smoke"
path = "src/bin/uat_pg_backfill_smoke.rs"
required-features = ["uat-pg-topology"]

[dependencies]
# Server (for local TestServer)
server_http = { package = "server-http", path = "../server-http", default-features = false }
server-core = { path = "../server-core", default-features = false }
auth = { path = "../auth", default-features = false }
ec = { path = "../ec", default-features = false }
storage = { path = "../storage", default-features = false }
checksum = { path = "../checksum", default-features = false }
observability = { path = "../observability" }
s3-types = { path = "../s3-types", default-features = false }

# AWS SDK (independent S3 client for validation)
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "http-1x", "sigv4a"] }
aws-credential-types = "1"
aws-sigv4 = { version = "1", default-features = false, features = ["sign-http", "http1"] }
aws-smithy-runtime-api = "1"
aws-smithy-types = { version = "1", features = ["http-body-1-x"] }
bytes = "1"
http-body-1x = { package = "http-body", version = "1" }

# Async runtime (required by AWS SDK)
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-native-certs = "0.8"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }

# Test infrastructure
tempfile = "3"
test-util = { path = "../test-util" }

# POST Object tests (raw HTTP, SigV4 signing)
base64 = "0.22"
md5_legacy = { package = "md-5", version = "0.10" }
serde_json = "1"
ring = "0.17"
url = "2.5.8"
