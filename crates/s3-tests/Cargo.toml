[package]
name = "s3-tests"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["real-ec", "isa-l-crc"]
real-ec = ["ec/real-backend", "server-core/real-ec", "server_http/real-ec"]
native-ec = ["ec/native-backend", "server-core/native-ec", "server_http/native-ec"]
isa-l-crc = ["checksum/isa-l", "server-core/isa-l-crc", "server_http/isa-l-crc", "storage/isa-l-crc"]
pure-rust-crc = ["checksum/pure-rust", "server-core/pure-rust-crc", "server_http/pure-rust-crc", "storage/pure-rust-crc"]
pure-rust = ["native-ec", "pure-rust-crc"]

[dependencies]
# Server (for local TestServer)
server_http = { package = "server-http", path = "../server-http", default-features = false }
server-core = { path = "../server-core", default-features = false }
auth = { path = "../auth" }
ec = { path = "../ec", default-features = false }
storage = { path = "../storage", default-features = false }
checksum = { path = "../checksum", default-features = false }
observability = { path = "../observability" }
s3-types = { path = "../s3-types" }

# AWS SDK (independent S3 client for validation)
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }

# Async runtime (required by AWS SDK)
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }

# Test infrastructure
tempfile = "3"
test-util = { path = "../test-util" }

# POST Object tests (raw HTTP, SigV4 signing)
ureq = "3"
base64 = "0.22"
md5_legacy = { package = "md-5", version = "0.10" }
serde_json = "1"
ring = "0.17"
url = "2.5.8"
