[package]
name = "s3-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Server (for local TestServer)
server = { path = "../server" }
auth = { path = "../auth" }
ec = { path = "../ec" }
storage = { path = "../storage" }

# AWS SDK (independent S3 client for validation)
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"

# Async runtime (required by AWS SDK)
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# HTTP server (same as server crate)
tiny_http = "0.12"

# Test infrastructure
tempfile = "3"
