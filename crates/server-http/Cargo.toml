[package]
name = "server-http"
version = "0.1.0"
edition = "2021"

[lib]
name = "server_http"
path = "src/lib.rs"

[features]
default = ["real-ec"]
real-ec = ["ec/real-backend", "server-core/real-ec"]
null-ec = ["ec/null-backend", "server-core/null-ec"]

[dependencies]
auth = { path = "../auth" }
checksum = { path = "../checksum" }
ec = { path = "../ec", default-features = false }
observability = { path = "../observability" }
server-core = { path = "../server-core", default-features = false }
s3-types = { path = "../s3-types" }
storage = { path = "../storage" }
base64 = "0.22"
ec-sys = { path = "../ec-sys" }
ring = "0.17"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
quick-xml = "0.37"
md5_legacy = { package = "md-5", version = "0.10" }
tokio-rustls = "0.26"

[dev-dependencies]
test-util = { path = "../test-util" }
server-core = { path = "../server-core", default-features = false, features = ["test-utils"] }
