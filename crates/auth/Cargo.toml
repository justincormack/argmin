[package]
name = "auth"
version = "0.1.0"
edition = "2021"

[features]
crypto-bench = ["checksum/bench-select"]
deep-tracing = ["observability/deep-tracing"]

[dependencies]
base64 = "0.22"
checksum = { path = "../checksum", default-features = false }
observability = { path = "../observability" }
ring = "0.17"
serde_json = "1"
s3-types = { path = "../s3-types" }
subtle = "2"
thiserror = "2"

[dev-dependencies]
aws-credential-types = "1"
aws-sigv4 = { version = "1", default-features = false, features = ["sign-http", "http1"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
proptest = "1"
rustls = { version = "0.23", features = ["ring"] }
