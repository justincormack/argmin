[package]
name = "argmin-s3"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "argmin-s3"
path = "src/main.rs"

[features]
local-debug-endpoints = ["server-http/local-debug-endpoints"]
deep-tracing = [
    "auth/deep-tracing",
    "ec/deep-tracing",
    "observability/deep-tracing",
    "server-core/deep-tracing",
    "server-http/deep-tracing",
    "storage/deep-tracing",
]

[dependencies]
auth = { path = "../auth" }
ec = { path = "../ec", default-features = false }
libc = "0.2"
observability = { path = "../observability" }
placement = { path = "../placement" }
server-core = { path = "../server-core", default-features = false }
server-http = { path = "../server-http", default-features = false }
storage = { path = "../storage", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
x509-cert = { version = "0.3", default-features = false }

[dev-dependencies]
openraft = { version = "=0.10.0-alpha.30", default-features = false }
storage = { path = "../storage", default-features = false, features = ["test-hooks"] }
test-util = { path = "../test-util" }
