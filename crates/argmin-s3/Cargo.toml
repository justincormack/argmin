[package]
name = "argmin-s3"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "argmin-s3"
path = "src/main.rs"

[features]
default = ["ring"]
ring = [
    "auth/ring",
    "server-core/ring",
    "server-http/ring",
    "storage/ring",
    "tls-provider/ring",
]
openssl = [
    "auth/openssl",
    "server-core/openssl",
    "server-http/openssl",
    "storage/openssl",
    "tls-provider/openssl",
]
local-debug-endpoints = ["server-http/local-debug-endpoints"]
test-unauthenticated-internal-rpc = []
test-live-metadata-transfer-failpoints = []
deep-tracing = [
    "auth/deep-tracing",
    "ec/deep-tracing",
    "observability/deep-tracing",
    "server-core/deep-tracing",
    "server-http/deep-tracing",
    "storage/deep-tracing",
]

[dependencies]
auth = { path = "../auth", default-features = false }
base64 = "0.22"
ec = { path = "../ec", default-features = false }
libc = "0.2"
observability = { path = "../observability" }
server-core = { path = "../server-core", default-features = false }
server-http = { path = "../server-http", default-features = false }
storage = { path = "../storage", default-features = false }
tls-provider = { path = "../tls-provider", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
x509-cert = { version = "0.3", default-features = false }

[dev-dependencies]
openraft = { version = "=0.10.0-alpha.35", default-features = false }
storage = { path = "../storage", default-features = false, features = ["test-hooks"] }
test-util = { path = "../test-util" }
