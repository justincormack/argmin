[package]
name = "s3-diff-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
s3-tests = { path = "../s3-tests" }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls", "http-1x", "sigv4a"] }
